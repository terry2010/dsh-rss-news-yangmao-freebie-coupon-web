# /data1/conf/nginx/conf.d/chuishiban.com.conf
# chuishiban.com 主站（astro SSG → web/dist）+ data.chuishiban.com 数据站（data-dist/）
#
# 证书（certbot webroot，一张证书覆盖三个域）：
#   certbot certonly --webroot -w /data1/webroot -d chuishiban.com -d www.chuishiban.com -d data.chuishiban.com
# 放配置前先签证书（443 块引用的 pem 不存在 nginx -t 会挂）；
# 或先把下方 443 server 块注释掉，签完再放开 reload。
#
# 内容更新链：cron deploy_check.sh → git pull + export-data.mjs（→ build/export.json、data-dist/）
#   → dirty/代码变更时 npm run build → web/dist。nginx 直接读盘，落盘即生效。
#   api.chuishiban.com / go.chuishiban.com 属私有仓 chuishiban，不在此 conf。

server {
    listen 80;
    server_name chuishiban.com www.chuishiban.com data.chuishiban.com;

    location /.well-known/acme-challenge/ { root /var/www/webroot; }

    location / { return 301 https://$host$request_uri; }
}

# 主站：host /data1/htdocs/chuishiban.com（git clone）→ 容器内 /var/www/html/chuishiban.com
# root 指到 web/dist，build/、data-dist/、server/、.git、scraper/ 不暴露
server {
    listen 443 ssl;
    server_name chuishiban.com www.chuishiban.com;

    ssl_certificate     /data1/certs/chuishiban.com/fullchain.pem;
    ssl_certificate_key /data1/certs/chuishiban.com/private/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html/chuishiban.com/web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # www 统一回主域
    if ($host = www.chuishiban.com) { return 301 https://chuishiban.com$request_uri; }

    location / { try_files $uri $uri/ =404; }

    # 纵深防御：root 若被改成 checkout 根，.git/.env 等也不泄露
    location ~ /\. { return 404; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# 数据站：data-dist/ 由 deploy_check 的 export-data.mjs 刷新（items.json + feeds/）
server {
    listen 443 ssl;
    server_name data.chuishiban.com;

    ssl_certificate     /data1/certs/chuishiban.com/fullchain.pem;
    ssl_certificate_key /data1/certs/chuishiban.com/private/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html/chuishiban.com/data-dist;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # cache 窗口与 CF 版 _headers 一致：items 60s，feeds 300s
    location = /items.json {
        add_header Cache-Control "public, max-age=60" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /feeds/ {
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ~ /\. { return 404; }
    location / { return 404; }

    add_header X-Content-Type-Options nosniff always;
}
